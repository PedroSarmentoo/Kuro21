<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14201c" />
    <meta name="description" content="Kuro21: Blackjack no navegador, com fichas virtuais." />
    <title>Kuro21</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314201c'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23c8372d' font-family='serif'%3E黒%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <h1 class="brand">Kuro<span class="brand__num">21</span></h1>
        <p class="balance" aria-live="polite">
          <span class="balance__label">Saldo</span>
          <span class="balance__value" id="balance-value">1000</span>
        </p>
      </header>

      <main class="table" id="table" aria-label="Mesa de Blackjack">
        <span class="table__mark" aria-hidden="true">黒</span>

        <section class="hand hand--dealer" aria-labelledby="dealer-title">
          <header class="hand__head">
            <h2 class="hand__title" id="dealer-title">Dealer</h2>
            <span class="score" id="dealer-score" aria-label="Pontuação do dealer">–</span>
          </header>
          <div class="hand__cards" id="dealer-cards">
            <div class="slot" aria-hidden="true"></div>
            <div class="slot" aria-hidden="true"></div>
          </div>
        </section>

        <p class="status" id="status" role="status" aria-live="polite">
          Escolha suas fichas para começar a rodada.
        </p>

        <section class="hand hand--player" aria-labelledby="player-title">
          <header class="hand__head">
            <h2 class="hand__title" id="player-title">Você</h2>
            <span class="score" id="player-score" aria-label="Sua pontuação">–</span>
          </header>
          <div class="hand__cards" id="player-cards">
            <div class="slot" aria-hidden="true"></div>
            <div class="slot" aria-hidden="true"></div>
          </div>
        </section>
      </main>

      <section class="controls" aria-label="Controles da rodada">
        <div class="bet">
          <div class="bet__chips" id="chips" role="group" aria-label="Fichas">
            <button class="chip chip--5" type="button" data-value="5" aria-label="Ficha de 5"><span>5</span></button>
            <button class="chip chip--10" type="button" data-value="10" aria-label="Ficha de 10"><span>10</span></button>
            <button class="chip chip--25" type="button" data-value="25" aria-label="Ficha de 25"><span>25</span></button>
            <button class="chip chip--50" type="button" data-value="50" aria-label="Ficha de 50"><span>50</span></button>
            <button class="chip chip--100" type="button" data-value="100" aria-label="Ficha de 100"><span>100</span></button>
          </div>
          <p class="bet__total">
            <span class="bet__label">Aposta</span>
            <span class="bet__value" id="bet-value">0</span>
          </p>
        </div>

        <div class="actions">
          <button class="btn btn--primary" id="btn-deal" type="button" disabled>
            Apostar e dar as cartas
          </button>
          <button class="btn" id="btn-hit" type="button" disabled>Comprar (Hit)</button>
          <button class="btn" id="btn-stand" type="button" disabled>Parar (Stand)</button>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
